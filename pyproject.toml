[project]
name = "mfr-adaptive-intelligence-core-pro"
version = "2.1.5"
description = "Evidence → Bayesian Reasoning → Verification → Self-Improvement. Transparent adaptive intelligence core of the FathiMind ecosystem."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Mohamed Fathi Alrahman", email = "m.fathi.alrahman@gmail.com"}]
keywords = ["bayesian", "evidence", "confidence", "decision", "audit-trail", "cognitive", "fathimind", "adaptive-intelligence"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/mfathialrahman-crypto/MFR-Adaptive-Intelligence-Core-Pro"
Documentation = "https://github.com/mfathialrahman-crypto/MFR-Adaptive-Intelligence-Core-Pro#readme"
Repository = "https://github.com/mfathialrahman-crypto/MFR-Adaptive-Intelligence-Core-Pro"
"Bug Tracker" = "https://github.com/mfathialrahman-crypto/MFR-Adaptive-Intelligence-Core-Pro/issues"
"FathiMind HQ" = "https://github.com/mfathialrahman-crypto/FathiMind"

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["mfr_core_pro"]
