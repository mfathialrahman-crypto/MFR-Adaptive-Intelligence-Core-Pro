[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mfr-adaptive-intelligence-core-pro"
version = "2.1.46"
description = "MFR Adaptive Intelligence Core Pro — Evidence → Bayesian Reasoning → Verification → Self-Improvement. Transparent adaptive intelligence core of the FathiMind ecosystem. Zero-dependency public MIT package."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Mohamed Fathi Alrahman", email = "mfathialrahman@example.com"}]
keywords = ["fathimind", "bayesian", "evidence", "cognitive-systems", "adaptive-intelligence", "audit-trail"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "mypy>=1.0"]

[tool.setuptools]
py-modules = ["mfr_core_pro", "version"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
