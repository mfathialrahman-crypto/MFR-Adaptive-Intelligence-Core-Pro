name: Run MFR Adaptive Intelligence Core Pro

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-demo:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Run Unit Tests
        run: |
          echo "=== Running Unit Tests (Python ${{ matrix.python-version }}) ==="
          python -m unittest test_mfr_core_pro.py -v

      - name: Run Adaptive Intelligence Demo
        run: |
          echo "============================================================"
          echo "MFR Adaptive Intelligence Core Pro - GitHub Actions Execution"
          echo "============================================================"
          python mfr_core_pro.py
