name: Run MFR Adaptive Intelligence Core Pro

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-demo:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: pip install pytest pytest-cov

      - name: Run Unit Tests with Coverage
        run: |
          echo "=== Running Unit Tests with Coverage (Python ${{ matrix.python-version }}) ==="
          python -m pytest test_mfr_core_pro.py -v --tb=short --cov=mfr_core_pro --cov-fail-under=90 --cov-report=term-missing

      - name: Run Adaptive Intelligence Demo
        run: |
          echo "============================================================"
          echo "MFR Adaptive Intelligence Core Pro - GitHub Actions Execution"
          echo "============================================================"
          python mfr_core_pro.py

  type-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install mypy
        run: pip install mypy

      - name: Strict type check
        run: mypy mfr_core_pro.py --strict --ignore-missing-imports

  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check version alignment
        run: |
          echo "Checking version consistency between version.py and pyproject.toml"
          PY_VER=$(python -c "from version import VERSION; print(VERSION.split('-')[0])")
          TOML_VER=$(grep -E '^version =' pyproject.toml | sed -E 's/.*\"(.*)\" .*/\\1/')
          echo "version.py base: $PY_VER"
          echo "pyproject.toml: $TOML_VER"
          if [ \"$PY_VER\" != \"$TOML_VER\" ]; then
            echo "ERROR: Version mismatch between version.py and pyproject.toml"
            exit 1
          fi
          echo "Versions aligned successfully."
